<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overnight</title>
<style>
:root{--bg:#0b1020;--card:#141b34;--line:#26305a;--tx:#eef1ff;--mut:#9aa6d6;--ok:#38d39f;--ask:#ffc857;--ver:#b58cff;--bad:#ff6b6b;--acc:#5b8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 -apple-system,Inter,Segoe UI,sans-serif}
h1{margin:0;font-size:30px}h2{margin:0 0 10px;font-size:20px;letter-spacing:.3px}small,.mut{color:var(--mut)}
header{display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sub{color:var(--mut);font-size:16px}.grow{flex:1}
.apps{display:flex;gap:8px;flex-wrap:wrap}.app{padding:4px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.dot.mock{background:var(--ask)}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:16px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}button.ok{background:var(--ok);color:#06241a}button.bad{background:#3a2030;color:#ffb4b4}
button.ver{background:var(--ver)}button:disabled{opacity:.5}
.big{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px}.stat b{display:block;font-size:38px;line-height:1.1}.stat span{color:var(--mut);font-size:14px}
main{display:grid;grid-template-columns:340px 1fr 370px;gap:16px;padding:0 24px 24px}
@media(max-width:1200px){main{grid-template-columns:1fr}.big{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.feed{max-height:420px;overflow:auto;font-size:14px}.ev{padding:6px 0;border-bottom:1px solid #1d2547;animation:in .4s}
@keyframes in{from{background:#2a3a7a}to{background:transparent}}
.ag{display:inline-block;padding:1px 8px;border-radius:6px;background:#22306a;font-size:12px;margin-right:6px;font-weight:700}
.tag{font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;margin-right:6px}
.AUTO{background:#12382c;color:var(--ok)}.ASK{background:#3d3215;color:var(--ask)}.VERIFY{background:#2d2250;color:var(--ver)}.BLOCKED{background:#401c1c;color:var(--bad)}
.row{padding:10px 0;border-bottom:1px solid #1d2547;display:flex;gap:12px;align-items:center}.row .t{flex:1}.why{color:var(--mut);font-size:14px}
.tl{position:relative}.blk{display:flex;gap:12px;padding:7px 10px;border-left:4px solid var(--acc);background:#10183a;border-radius:8px;margin-bottom:6px}
.blk.task{border-color:var(--ok)}.blk .tm{width:110px;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e1430;color:var(--tx);font-size:16px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}.modal>div{background:var(--card);border:1px solid var(--ver);border-radius:16px;padding:28px;width:460px;text-align:center}
pre{background:#0a0f26;padding:10px;border-radius:8px;overflow:auto;font-size:13px}
.bar{height:14px;border-radius:8px;background:#26305a;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
.pill{font-size:12px;padding:2px 8px;border-radius:6px;margin:2px;display:inline-block}.pass{background:#12382c;color:var(--ok)}.fail{background:#401c1c;color:var(--bad)}
</style></head>
<body><div id="root"></div>
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/htm.umd.js"></script>
<script>
const {useState,useEffect,useRef}=React; const html=htm.bind(React.createElement);
const api=(p,o)=>fetch(p,o).then(r=>r.json().then(j=>({ok:r.ok,...j,_s:r.status})));
const post=(p)=>api(p,{method:'POST'});
const tm=s=>new Date(s).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'});

function Graph({g}){
  const nodes=g.nodes||[]; const W=320,H=260,cx=W/2,cy=H/2; const col={person:'#5b8cff',event:'#38d39f',preference:'#ffc857',task:'#ff9f6b',lesson:'#b58cff'};
  const pos={}; nodes.forEach((n,i)=>{ if(n.id==='maya'){pos[n.id]=[cx,cy];return} const k=i-1,a=k*2.4,r=60+(k%3)*28; pos[n.id]=[cx+Math.cos(a)*r*1.25,cy+Math.sin(a)*r*0.9]});
  return html`<svg width="100%" viewBox="0 0 ${W} ${H}">${(g.edges||[]).map((e,i)=>html`<line key=${i} x1=${pos[e.from]?.[0]} y1=${pos[e.from]?.[1]} x2=${pos[e.to]?.[0]} y2=${pos[e.to]?.[1]} stroke="#2c3869"/>`)}
  ${nodes.map(n=>html`<g key=${n.id}><circle cx=${pos[n.id][0]} cy=${pos[n.id][1]} r=${n.id==='maya'?13:6} fill=${col[n.kind]||'#888'}><title>${n.label}</title></circle>${(n.id==='maya'||n.kind==='preference'||n.kind==='task'||n.kind==='lesson')?html`<text x=${pos[n.id][0]+9} y=${pos[n.id][1]+4} fill="#9aa6d6" font-size="9">${n.label.slice(0,26)}</text>`:null}</g>`)}</svg>`;
}

function Persona({task,onDone,onClose}){
  const [st,setSt]=useState('starting'); const iid=useRef(null);
  useEffect(()=>{let stop=false;(async()=>{const r=await post(`/verify/${task.id}/start`); iid.current=r.id; setSt('pending');
    while(!stop){await new Promise(r=>setTimeout(r,1000)); const s=await api(`/verify/${iid.current}/status?tid=${task.id}`); if(s.status==='completed'){setSt('ok');setTimeout(onDone,900);return}
      if(['failed','declined','expired'].includes(s.status)){setSt('fail');return}}})();return()=>{stop=true}},[]);
  return html`<div class="modal"><div><div style=${{fontSize:46}}>🛡️</div><h2>Identity check (Persona)</h2>
  <p class="mut">${task.title}</p>
  ${st==='ok'?html`<h2 style=${{color:'var(--ok)'}}>Verified ✓</h2>`:st==='fail'?html`<h2 style=${{color:'var(--bad)'}}>Verification failed</h2>`:html`<p>Verifying it's really you…</p>`}
  <button class="ghost" onClick=${onClose}>Close</button> <small style=${{cursor:'pointer',opacity:.4,marginLeft:8}} onClick=${()=>iid.current&&post(`/verify/${iid.current}/simulate`)}>⚡</small></div></div>`;
}


const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';
function Evidence({r}){
  const ev=r.evidence||{};
  return html`<div style=${{padding:'8px 0'}}>${r.check_results.map(c=>html`<div key=${c.id} class="why" style=${{color:c.passed?'var(--ok)':'var(--bad)'}}>${c.passed?'✓':'✗'} <b>${c.desc}</b>${c.passed?null:html` — expected <i>${String(c.expected)}</i>, observed <i>${String(c.observed)}</i> <span class="tag ASK">${c.category}</span>`}</div>`)}
   <details><summary class="why">Effects log (${(ev.effects||[]).length}) · events (${(ev.events||[]).length}) · tasks</summary>
    <pre>${(ev.effects||[]).map(e=>`${String(e.t).padStart(6)}s ${e.ok?'OK  ':'FAIL'} ${e.service}.${e.op} ${e.deduped?'(deduped) ':''}${e.error||''}`).join('\n')||'(no outside effects)'}</pre>
    <pre>${(ev.tasks||[]).map(t=>`${t.decision} ${t.status} | ${t.title}\n   ${t.result||t.why}`).join('\n')}</pre>
    <pre>${(ev.events||[]).map(e=>`${e.agent}/${e.step}: ${e.summary}`).join('\n')}</pre></details></div>`;
}
function FiredrillPanel(){
  const [st,setSt]=useState(null); const [open,setOpen]=useState({});
  const poll=async()=>{try{setSt(await api('/firedrill/status'))}catch(e){}};
  useEffect(()=>{poll();const t=setInterval(poll,1000);return()=>clearInterval(t)},[]);
  if(!st)return null;
  const busy=st.running||st.sre_running; const rows=st.running?st.progress:(st.latest?st.latest.results:[]); const sre=st.sre;
  const base=st.baseline, last=st.latest;
  return html`<div class="card" style=${{margin:'0 24px 24px'}}><h2>🔥 Firedrill simulations + SRE agent <small>(local harness; maps 1:1 to Firedrill)</small></h2>
   <div style=${{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:12}}>
    <button disabled=${busy} onClick=${()=>post('/firedrill/run?label='+(st.n_runs?'re-run':'baseline'))}>${st.running?`Running ${st.progress.length}/${st.total}…`:st.n_runs?'↻ Re-run simulations':'▶ Run simulations'}</button>
    <button disabled=${busy||!st.latest} onClick=${()=>post('/sre/run')}>${st.sre_running?'SRE agent working…':'🛠 Run SRE agent'}</button>
    ${st.staged?html`<button class="ok" onClick=${()=>post('/sre/apply').then(poll)}>Apply patches</button>`:null}
    ${st.history.some(h=>h.status==='applied')?html`<button class="bad" onClick=${()=>post('/sre/revert').then(poll)}>Revert last apply</button>`:null}
    <small class="mut">config ${st.config}</small></div>
   ${base?html`<div class="big" style=${{padding:0,margin:'0 0 12px'}}>
     <div class="stat"><b>${base.pass}/${base.total}</b><span>first run (before) · ${pct(base.pass,base.total)}</span></div>
     <div class="stat"><b style=${{color:last.pass>base.pass?'var(--ok)':'inherit'}}>${last.pass}/${last.total}</b><span>latest run (${st.n_runs>1?'after':'same'}) · ${pct(last.pass,last.total)}</span></div>
     ${sre?html`<div class="stat"><b>${sre.pass_before}→${sre.pass_after}</b><span>SRE staged result (validated)${sre.applied?' · APPLIED':''}</span></div>`:html`<div class="stat"><b>–</b><span>SRE not run</span></div>`}
     <div class="stat"><b>${sre?sre.kept.length+'/'+sre.rejected.length+'/'+sre.escalated.length:'–'}</b><span>patches kept / rejected / escalated</span></div></div>`:html`<p class="mut">Runs 15 failure scenarios (outages, 429s, phishing, injection, spoofing, mid-run instructions…) through the real pipeline in isolated worlds. Results are measured, not scripted.</p>`}
   <div>${rows.map(r=>html`<div key=${r.id} class="row" style=${{display:'block',cursor:'pointer'}} onClick=${()=>setOpen({...open,[r.id]:!open[r.id]})}>
     <span class=${'tag '+(r.passed?'AUTO':'BLOCKED')}>${r.passed?'✓ PASS':'✗ FAIL'}</span><b>${r.id} ${r.name}</b> <small class="mut">${r.duration_ms} ms</small>
     ${r.passed?null:html`<div class="why" style=${{color:'var(--bad)'}}>${r.check_results.filter(c=>!c.passed).map(c=>c.desc).join(' · ')}</div>`}
     ${open[r.id]?html`<${Evidence} r=${r}/>`:null}</div>`)}</div>
   ${sre?html`<h2 style=${{marginTop:18}}>SRE agent report <small>(${sre.diagnoser} diagnoser)</small></h2>
    ${sre.kept.map(k=>html`<div key=${k.id} class="card" style=${{borderColor:'var(--ok)'}}><span class="tag AUTO">KEPT</span><b>${k.file}</b> — ${k.rationale}<div class="why">fixes ${k.gained.join(', ')} · no regressions · ${k.pass_before}→${k.pass_after} passing · category ${k.category}</div><pre>${k.diff}</pre></div>`)}
    ${sre.rejected.map(k=>html`<div key=${k.id} class="card" style=${{borderColor:'var(--bad)'}}><span class="tag BLOCKED">REJECTED</span><b>${k.file}</b> — ${k.rationale}<div class="why">${k.reason}</div></div>`)}
    <h2>Diagnoses</h2>${sre.diagnoses.map((d,i)=>html`<div class="row" key=${i} style=${{display:'block'}}><span class="tag ASK">${d.category}</span><b>${d.scenario_id} ${d.scenario}</b><div class="why">${d.root_cause}</div>${d.escalate?html`<div class="why" style=${{color:'var(--ask)'}}>⚠ Escalated to a human (code change): ${d.escalate}</div>`:null}</div>`)}
    ${sre.lessons.length?html`<div class="why">Lessons stored in memory: ${sre.lessons.join(' | ')}</div>`:null}`:null}
   ${st.history.length?html`<div class="why" style=${{marginTop:10}}>Patch history: ${st.history.map(h=>h.id+' ('+h.status+', '+h.patches.length+' patches)').join(' · ')}</div>`:null}
  </div>`;
}

function App(){
  const [health,setH]=useState({connectors:[]}); const [plan,setPlan]=useState(null); const [brief,setBrief]=useState(null); const [m,setM]=useState({});
  const [events,setEv]=useState([]); const [graph,setG]=useState({}); const [txt,setTxt]=useState(''); const [running,setRun]=useState(false);
  const [ver,setVer]=useState(null); const [fd,setFd]=useState(null); const [sre,setSre]=useState(null); const [msg,setMsg]=useState(''); const [utasks,setUt]=useState([]); const [prefs,setPrefs]=useState([]); const [toast,setToast]=useState(null); const [addErr,setAddErr]=useState(''); const [adding,setAdding]=useState(false); const [chip,setChip]=useState([]);
  const loadUt=async()=>{try{const r=await api('/user-tasks'); setUt(r.tasks||[]); setPrefs(r.preferences||[])}catch(e){}};
  const showToast=(t)=>{setToast(t); setTimeout(()=>setToast(null),4000)};
  const addTask=async()=>{const text=txt.trim(); if(adding)return; setAddErr(''); if(!text){setAddErr('Please type a task first');return}
    setAdding(true); try{const r=await api('/user-task',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});
      if(!r.ok){setAddErr(typeof r.detail==='string'?r.detail:(r.detail&&r.detail[0]&&r.detail[0].msg)||('Server error '+r._s))}
      else{setTxt(''); setChip(r.preferences||[]); showToast('Saved to memory • will be planned tonight'); await loadUt(); load()}}
    catch(e){setAddErr('Could not reach the server: '+e.message)} finally{setAdding(false)}};
  const load=async()=>{const p=await api('/plan'); setPlan(p.plan); setBrief(p.brief); setM(p.metrics||{}); setRun(p.running); setG(await api('/memory/graph'))};
  useEffect(()=>{api('/health').then(setH);load();loadUt();
    setTimeout(load,1500); const es=new EventSource('/events'); es.onmessage=e=>{const ev=JSON.parse(e.data); setEv(x=>[...x.slice(-80),ev]); if(ev.step==='run_complete'||ev.step==='ingest'||ev.step==='preference'){load();loadUt()} if(ev.step==='start')setRun(true); if(ev.step==='run_complete')setRun(false)}; return()=>es.close()},[]);
  const tasks=plan?plan.tasks:[]; const by=s=>tasks.filter(t=>t.status===s);
  const done=by('done'), needs=tasks.filter(t=>t.status==='needs_you'&&t.action_type!=='work'), blocked=by('blocked');
  const act=async(p)=>{const r=await post(p); if(!r.ok)setMsg(r.detail||'error'); load()};
  const feedEnd=useRef(); useEffect(()=>{feedEnd.current?.scrollIntoView({block:'end'})},[events.length]);
  const tag=t=>t.status==='blocked'?'BLOCKED':t.decision;
  return html`<div>
  <header><h1>🌙 Overnight</h1><span class="sub">Plans your tomorrow while you sleep — and quietly does the boring stuff.</span><span class="grow"/>
   <div class="apps">${(health.connectors||[]).map(c=>html`<span class="app" key=${c.name}><i class=${'dot '+(c.mode==='mock'?'mock':'')}/>${c.name}</span>`)}</div>
   <button disabled=${running} onClick=${()=>{setEv([]);post('/run-night')}}>${running?'Running…':'▶ Simulate tonight'}</button></header>
  <div class="big">
   <div class="stat"><b>${m.auto_done??'–'}</b><span>tasks done for you</span></div>
   <div class="stat"><b>${m.minutes_saved??'–'} min</b><span>planning & admin saved</span></div>
   <div class="stat"><b>${m.cost_per_night!=null?'$'+m.cost_per_night.toFixed(3):'–'}</b><span>cost per night</span></div>
   <div class="stat"><b>${m.small_model_pct!=null?m.small_model_pct+'%':'–'}</b><span>calls handled by small models</span></div></div>
  <main>
   <div>
    <div class="card"><h2>Live agents</h2><div class="feed">${events.length?events.map(e=>html`<div class="ev" key=${e.seq}><span class="ag">${e.agent}</span>${e.decision?html`<span class=${'tag '+e.decision}>${e.decision}</span>`:null}${e.summary}${e.why?html`<div class="why">${e.why}</div>`:null}</div>`):html`<span class="mut">Press “Simulate tonight”.</span>`}<div ref=${feedEnd}/></div></div>
    <div class="card"><h2>Memory graph <small>(Cognee)</small></h2><${Graph} g=${graph}/><small>${graph.docs||0} documents remembered</small></div>
   </div>
   <div>
    ${!plan?html`<div class="card"><h2>Morning brief</h2><p class="mut">No plan yet. Hit “Simulate tonight” to see what Overnight does while Maya sleeps.</p></div>`:html`
    <div class="card"><h2>☀️ Morning brief — ${new Date(plan.date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</h2><p>${brief?.greeting}</p><p class="mut">${plan.summary} · planner: ${plan.planner}</p>
     <div class="tl">${plan.blocks.map((b,i)=>html`<div class=${'blk '+b.kind} key=${i}><span class="tm">${tm(b.start)}–${tm(b.end)}</span><div><b>${b.title}</b>${b.note?html`<div class="why">${b.note}</div>`:null}</div></div>`)}</div></div>
    <div class="card"><h2>Needs you (${needs.length})</h2>${msg?html`<div class="why" style=${{color:'var(--bad)'}}>${msg}</div>`:null}
     ${needs.map(t=>html`<div class="row" key=${t.id}><div class="t"><span class=${'tag '+tag(t)}>${tag(t)}</span>${t.title}<div class="why">${t.why}</div></div>
      ${t.decision==='VERIFY'?html`<button class="ver" onClick=${()=>setVer(t)}>🛡️ Verify & approve</button>`:html`<button class="ok" onClick=${()=>act('/approve/'+t.id)}>Approve</button>`}
      <button class="bad" onClick=${()=>act('/reject/'+t.id)}>Reject</button></div>`)}${needs.length?null:html`<span class="mut">Nothing needs you 🎉</span>`}</div>
    ${tasks.some(t=>t.status==='failed')?html`<div class="card" style=${{borderColor:'var(--bad)'}}><h2>⚠️ Failed - NOT done (${tasks.filter(t=>t.status==='failed').length})</h2>${tasks.filter(t=>t.status==='failed').map(t=>html`<div class="row" key=${t.id}><div class="t"><span class="tag BLOCKED">FAILED</span>${t.title}<div class="why">${t.result?.why}</div></div></div>`)}</div>`:null}
    <div class="card"><h2>🚫 Blocked for your safety (${blocked.length})</h2>${blocked.map(t=>html`<div class="row" key=${t.id}><div class="t"><span class="tag BLOCKED">BLOCKED</span>${t.title}<div class="why">${t.why}</div></div></div>`)}</div>
    <div class="card"><h2>Done for you (${done.length})</h2>${done.map(t=>html`<div class="row" key=${t.id}><div class="t"><span class="tag AUTO">AUTO</span>${t.title}<div class="why">${t.why}</div></div><button class="ghost" onClick=${()=>act('/undo/'+t.id)}>Undo</button></div>`)}
     ${tasks.filter(t=>t.status==='approved'||t.result?.status==='done'&&t.decision!=='AUTO').map(t=>html`<div class="row" key=${t.id}><div class="t"><span class=${'tag '+t.decision}>${t.decision}</span>${t.title} <small>(approved)</small><div class="why">${t.result?.why}</div></div></div>`)}</div>`}
   </div>
   <div>
    <div class="card" id="addtask"><h2>Add a task</h2>
     <div style=${{display:'flex',gap:8}}><input id="task-input" type="text" placeholder="book dentist, I prefer mornings" value=${txt} disabled=${adding} onInput=${e=>setTxt(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')addTask()}}/><button id="task-add" disabled=${adding} onClick=${addTask}>${adding?'…':'Add'}</button></div>
     ${addErr?html`<div id="task-error" class="why" style=${{color:'var(--bad)',marginTop:6}}>${addErr}</div>`:null}
     ${chip.map(c=>html`<span class="pill pass chip-pref" key=${c} style=${{marginTop:8}}>Preference learned: ${c.replace(/^Maya prefers /,'')}</span>`)}
     <p class="why">Stored in Cognee memory. Press “Simulate tonight” to place it in tomorrow's plan.</p>
     <h2 style=${{marginTop:12,fontSize:17}}>Your tasks (${utasks.length})</h2>
     <div id="your-tasks">${utasks.length?utasks.map(u=>html`<div class="row" key=${u.id}><div class="t">${u.text}<div class="why">source: ${u.source} · added ${new Date(u.created).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div>${u.why?html`<div class="why">${u.why}</div>`:null}</div><span class=${'pill '+(u.planned?'pass':'')} style=${{background:u.planned?'':'#3d3215',color:u.planned?'':'var(--ask)'}}>${u.status}</span></div>`):html`<span class="mut">None yet.</span>`}</div>
     ${prefs.length?html`<div class="why" style=${{marginTop:8}}>Memory: ${prefs.join(' · ')}</div>`:null}</div>
   </div></main>
  <${FiredrillPanel}/>
  ${toast?html`<div id="toast" style=${{position:'fixed',bottom:24,right:24,background:'var(--ok)',color:'#06241a',padding:'12px 20px',borderRadius:12,fontWeight:700,zIndex:20}}>${toast}</div>`:null}
  ${ver?html`<${Persona} task=${ver} onClose=${()=>setVer(null)} onDone=${async()=>{setVer(null);await act('/approve/'+ver.id)}}/>`:null}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
